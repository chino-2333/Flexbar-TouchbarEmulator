name: Publish signed plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Verify prebuilt package
        shell: bash
        run: |
          sha256sum --check com.chino.touchbaremulator.flexplugin.sha256
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          test -f "release-notes/${GITHUB_REF_NAME#v}.md"
          python3 - <<'PYTHON'
          import json, os, zipfile
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("com.chino.touchbaremulator.plugin/manifest.json") as f:
              assert json.load(f)["version"] == version
          with zipfile.ZipFile("com.chino.touchbaremulator.flexplugin") as package:
              manifests = [n for n in package.namelist() if n == "manifest.json" or n.endswith("/manifest.json")]
              assert len(manifests) == 1, manifests
              assert json.loads(package.read(manifests[0]))["version"] == version
          PYTHON
      - name: Publish release and signed package
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes/${{ env.RELEASE_VERSION }}.md
          fail_on_unmatched_files: true
          files: |
            com.chino.touchbaremulator.flexplugin
            com.chino.touchbaremulator.flexplugin.sha256
